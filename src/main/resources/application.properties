spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:mysql://rds-endpoint.amazonaws.com:3306/pedidos360_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=secret_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_xxxxxxxxx